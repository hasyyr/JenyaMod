plugins { id 'net.fabricmc.fabric-loom-remap' version '1.14.10' }
version = '0.2.0'
group = 'ru.jenya'
base { archivesName = 'jenya-fabric-1.21.11' }
repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "jenya" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.139.4+1.21.11'
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.11:5.4.3'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }


import groovy.json.JsonSlurper
import javax.imageio.ImageIO
import java.awt.image.BufferedImage
import java.util.BitSet

// Keep the original Ellie geometry/UV layout, but recolor the packaged texture
// so the companion has chestnut hair and a charcoal/teal outfit.
tasks.register('recolorJenyaTexture') {
    dependsOn tasks.named('processResources')
    doLast {
        File textureFile = file("$buildDir/resources/main/assets/jenya/textures/entity/jenya.png")
        File modelFile = file("$buildDir/resources/main/assets/jenya/geckolib/models/entity/jenya.geo.json")
        BufferedImage image = ImageIO.read(textureFile)
        def model = new JsonSlurper().parse(modelFile)
        def geometry = model['minecraft:geometry'][0]
        int textureWidth = geometry.description.texture_width as int
        int width = image.width
        int height = image.height
        double scale = width / (double) textureWidth
        def bones = geometry.bones
        Map<String, String> parents = [:]
        bones.each { b -> if (b.parent) parents[b.name as String] = b.parent as String }
        def ancestors = { String name ->
            List<String> result = []
            String current = name
            while (current != null) {
                result.add(current)
                current = parents[current]
            }
            result
        }
        BitSet hair = new BitSet(width * height)
        BitSet clothes = new BitSet(width * height)
        def addRect = { BitSet mask, def uv ->
            if (!(uv instanceof Map) || !uv.containsKey('uv') || !uv.containsKey('uv_size')) return
            double x = uv.uv[0] as double
            double y = uv.uv[1] as double
            double w = uv.uv_size[0] as double
            double h = uv.uv_size[1] as double
            int x0 = Math.max(0, Math.min(width, (int)Math.floor(Math.min(x, x + w) * scale)))
            int x1 = Math.max(0, Math.min(width, (int)Math.ceil(Math.max(x, x + w) * scale)))
            int y0 = Math.max(0, Math.min(height, (int)Math.floor(Math.min(y, y + h) * scale)))
            int y1 = Math.max(0, Math.min(height, (int)Math.ceil(Math.max(y, y + h) * scale)))
            for (int py = y0; py < y1; py++) {
                int row = py * width
                for (int px = x0; px < x1; px++) mask.set(row + px)
            }
        }
        bones.each { b ->
            List<String> lineage = ancestors(b.name as String)
            boolean isHair = lineage.any { it in ['hair', 'frontHair', 'headband'] }
            boolean underHead = lineage.contains('head')
            boolean isClothing = !underHead && lineage.any { it in ['torso', 'armL', 'armR', 'lowerArmL', 'lowerArmR', 'legL', 'legR', 'body', 'armorChest', 'armorLegs', 'armorBoots', 'hip', 'hotpants', 'slip', 'bra'] }
            (b.cubes ?: []).each { cube ->
                (cube.uv ?: [:]).values().each { uv ->
                    if (isHair) addRect(hair, uv)
                    if (isClothing) addRect(clothes, uv)
                }
            }
        }
        for (int y = 0; y < height; y++) {
            for (int x = 0; x < width; x++) {
                int index = y * width + x
                int argb = image.getRGB(x, y)
                int a = (argb >>> 24) & 255
                if (a == 0) continue
                int r = (argb >>> 16) & 255
                int g = (argb >>> 8) & 255
                int b = argb & 255
                boolean skin = r > 190 && g > 140 && g < 240 && b > 130 && b < 225
                double lum = 0.299 * r + 0.587 * g + 0.114 * b
                if (hair.get(index) && !skin) {
                    double v = lum / 255.0
                    int nr = (int)Math.max(0, Math.min(255, 38 + 80 * v))
                    int ng = (int)Math.max(0, Math.min(255, 20 + 48 * v))
                    int nb = (int)Math.max(0, Math.min(255, 17 + 36 * v))
                    image.setRGB(x, y, (a << 24) | (nr << 16) | (ng << 8) | nb)
                } else if (clothes.get(index) && !skin) {
                    int max = Math.max(r, Math.max(g, b))
                    int min = Math.min(r, Math.min(g, b))
                    double saturation = (max - min) / (double)(max + 1)
                    if (saturation < 0.24) {
                        double v = lum / 255.0
                        double[] stops = [0.0d, 0.18d, 0.38d, 0.58d, 0.78d, 1.0d] as double[]
                        int[][] palette = [[18,20,27],[27,31,40],[35,48,57],[43,78,87],[76,116,123],[132,153,151]] as int[][]
                        int segment = 0
                        while (segment < stops.length - 2 && v > stops[segment + 1]) segment++
                        double t = (v - stops[segment]) / (stops[segment + 1] - stops[segment])
                        int nr = (int)(palette[segment][0] * (1-t) + palette[segment+1][0] * t)
                        int ng = (int)(palette[segment][1] * (1-t) + palette[segment+1][1] * t)
                        int nb = (int)(palette[segment][2] * (1-t) + palette[segment+1][2] * t)
                        image.setRGB(x, y, (a << 24) | (nr << 16) | (ng << 8) | nb)
                    }
                }
            }
        }
        // Dedicated fabric patch for the fitted torso top (UV 24..32 x 0..6).
        for (int py = 0; py < 6; py++) {
            for (int px = 0; px < 8; px++) {
                double shade = 1.0 - (Math.abs(px - 3.5) / 10.0) - (py / 90.0)
                int rr = (int)(35 * shade)
                int gg = (int)(158 * shade)
                int bb = (int)(164 * shade)
                image.setRGB(24 + px, py, (255 << 24) | (rr << 16) | (gg << 8) | bb)
            }
        }
        ImageIO.write(image, 'png', textureFile)
        println("Recolored Jenya texture at ${textureFile}")
    }
}
tasks.named('jar') { dependsOn tasks.named('recolorJenyaTexture') }
