plugins { id 'net.fabricmc.fabric-loom-remap' version '1.11-SNAPSHOT' }
version = '0.2.0'
group = 'ru.jenya'
base { archivesName = 'jenya-fabric-1.21.11' }

loom {
    splitEnvironmentSourceSets()
    mods {
        "jenya" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.139.4+1.21.11'
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.11:5.4.3'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
